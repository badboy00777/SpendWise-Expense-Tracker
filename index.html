<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="SpendWise - a simple expense tracker built with HTML, CSS and JavaScript.">
    <title>SpendWise | Your Personal Expense Tracker</title>
    <link rel="stylesheet" href="style/style.css">
</head>

<body>
    <header class="app-header">
        <div class="container">
            <h1>SpendSp<span>wise</span></h1>
            <p>Track your daily expenses with ease and see where your money goes.</p>
        </div>
    </header>
    <main class="container app-layout">
        <section class="panel" id="formPanel">
            <h2 id="formTitle">Add Expense</h2>
            <form id="expenseForm" novalidate>
                <div class="form-group">
                    <label for="title">Title</label>
                    <input type="text" id="title" placeholder="e.g. Groceries" maxlength="40">
                    <small class="error-text" id="titleError"></small>
                </div>
                <div class="form-group">
                    <label for="amount">Amount (Rs)</label>
                    <input type="number" id="amount" placeholder="0.00" min="0" step="0.01">
                    <small class="error-text" id="amountError"></small>
                </div>
                <div class="form-group">
                    <label for="category">Category</label>
                    <select id="category">
                        <option value="">Select category</option>
                        <option value="Food">Food</option>
                        <option value="Transport">Transport</option>
                        <option value="Shopping">Shopping</option>
                        <option value="Bills">Bills</option>
                        <option value="Health">Health</option>
                        <option value="Entertainment">Entertainment</option>
                        <option value="Education">Education</option>
                        <option value="Other">Other</option>
                    </select>
                    <small class="error-text" id="categoryError"></small>
                </div>
                <div class="form-group">
                    <label for="date">Date</label>
                    <input type="date" id="date">
                    <small class="error-text" id="dateError"></small>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary" id="submitBtn">Add Expense</button>
                </div>
            </form>
        </section>
        <section>
            <h2>Your Expenses</h2>
            <ul class="expense-list" id="expenseList"></ul>
            <p class="empty-state" id="emptyState">No expenses added yet.</p>
        </section>

    </main>
    <footer class="app-footer">
        <div class="container">
            <p>&copy; 2024 SpendWise. All rights reserved.</p>
        </div>
    </footer>
    <div class="toast" id="toast" role="status"></div>
    <script src="js/script.js"></script>

</body>

</html>
